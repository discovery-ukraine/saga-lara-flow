# Dev toolchain for saga-lara-flow. Run composer/pest/pint/phpstan under PHP 8.5:
#   docker compose build
#   docker compose run --rm app composer update
#   docker compose run --rm app composer test
#   docker compose run --rm app composer lint
#
# The suite runs on SQLite by default and `app` depends on nothing, so the command
# above starts one container and no database. Each server run is a separate command
# behind a profile of its own:
#   docker compose --profile mysql run --rm app-mysql vendor/bin/pest
#   docker compose --profile pgsql run --rm app-pgsql vendor/bin/pest
services:
  app: &app
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: saga-lara-flow-dev
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/root/.composer

  # The same toolchain pointed at a server. Each pair lives in a profile of its own,
  # so neither half is started by a command that does not ask for it.
  app-mysql:
    <<: *app
    profiles: [mysql]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SAGA_TEST_DB: mysql
      SAGA_TEST_DB_HOST: mysql

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    # Durability buys nothing for a throwaway test database and costs an fsync on
    # every one of the suite's writes.
    command: --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=0
    environment:
      MYSQL_ROOT_PASSWORD: saga
      MYSQL_DATABASE: saga_test
      MYSQL_USER: saga
      MYSQL_PASSWORD: saga
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-psaga"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s

  app-pgsql:
    <<: *app
    profiles: [pgsql]
    depends_on:
      pgsql:
        condition: service_healthy
    environment:
      SAGA_TEST_DB: pgsql
      SAGA_TEST_DB_HOST: pgsql
      SAGA_TEST_DB_PORT: 5432

  pgsql:
    image: postgres:18
    profiles: [pgsql]
    # Same trade as the MySQL service: a throwaway test database has nothing to
    # gain from surviving a power cut, and every write pays for it.
    command: -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_DB: saga_test
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
    volumes:
      # Postgres 18 wants the mount one level up: the data goes in a subdirectory of
      # it, and a volume placed at .../data instead makes the image refuse to start.
      - pgsql-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d saga_test"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  composer-cache:
  mysql-data:
  pgsql-data:
